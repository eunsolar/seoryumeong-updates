name: Build Windows release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install --upgrade pip pyinstaller pymupdf pillow pytesseract xlsxwriter
      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Seoryumeong --icon dog.ico --add-data "dog.ico;." --hidden-import updater --collect-all fitz app.py
      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/Seoryumeong.exe release/
          Copy-Item dog.ico release/
          Compress-Archive -Path release/* -DestinationPath Seoryumeong-Windows.zip -Force
      - name: Upload Release asset
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create $env:GITHUB_REF_NAME Seoryumeong-Windows.zip --title "서류멍 $env:GITHUB_REF_NAME" --notes "Windows용 실행 파일. 최초 실행 전에 압축을 풀어 주세요. 이미지 OCR에는 별도 Tesseract 설치가 필요합니다."
