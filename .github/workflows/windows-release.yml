
name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requirements
        run: python -m pip install --upgrade pip pyinstaller pymupdf pillow pytesseract xlsxwriter

      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Seoryumeong --icon dog.ico --add-data "dog.ico;." --hidden-import updater --collect-all fitz app.py

      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/Seoryumeong.exe release/
          Copy-Item dog.ico release/
          Compress-Archive -Path release/* -DestinationPath Seoryumeong-Windows.zip -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seoryumeong-Windows
          path: Seoryumeong-Windows.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME Seoryumeong-Windows.zip --title "Seoryumeong $env:GITHUB_REF_NAME" --notes "Windows executable. Extract the ZIP before launching. Tesseract OCR is required for scanned documents."
