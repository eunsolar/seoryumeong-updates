name: Build Windows release

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set build version
        shell: pwsh
        run: |
          $version = "4.3.${{ github.run_number }}"
          "VERSION = '$version'" | Set-Content -Path build_info.py -Encoding utf8
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install requirements
        run: python -m pip install --upgrade pip pyinstaller pymupdf==1.24.14 pillow pytesseract xlsxwriter
      - name: Build Windows EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Seoryumeong --icon dog.ico --add-data "dog.ico;." --hidden-import updater --hidden-import build_info app.py
      - name: Package release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item dist/Seoryumeong.exe release/
          Copy-Item dog.ico release/
          Compress-Archive -Path release/* -DestinationPath Seoryumeong-Windows.zip -Force
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Seoryumeong-Windows
          path: Seoryumeong-Windows.zip
          if-no-files-found: error
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:APP_VERSION"
          gh release create $tag Seoryumeong-Windows.zip --target $env:GITHUB_SHA --title "서류멍 $tag" --notes "Windows 실행 파일. ZIP을 푼 후 실행하세요. 문서 데이터는 업로드되지 않습니다."
